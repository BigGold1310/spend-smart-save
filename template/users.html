<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Display</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
<div class="bg-white p-8 rounded-lg shadow-md w-full max-w-2xl">
    <h1 class="text-3xl font-bold mb-6 text-center text-gray-800">User Information</h1>
    <table class="w-full border-collapse">
        <thead>
        <tr class="bg-gray-200">
            <th class="p-3 text-left text-gray-600 font-semibold">ID</th>
            <th class="p-3 text-left text-gray-600 font-semibold">Name</th>
            <th class="p-3 text-left text-gray-600 font-semibold">Email</th>
        </tr>
        </thead>
        <tbody>
        <tr class="border-b border-gray-200 hover:bg-gray-100">
            <td class="p-3">1</td>
            <td class="p-3">John Doe</td>
            <td class="p-3">john.doe@example.com</td>
        </tr>
        <tr class="border-b border-gray-200 hover:bg-gray-100">
            <td class="p-3">2</td>
            <td class="p-3">Jane Smith</td>
            <td class="p-3">jane.smith@example.com</td>
        </tr>
        <tr class="hover:bg-gray-100">
            <td class="p-3">3</td>
            <td class="p-3">Bob Johnson</td>
            <td class="p-3">bob.johnson@example.com</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
